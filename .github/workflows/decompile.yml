name: Decompile Zara APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'Zara-1.0.apk'

jobs:
  decompile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install apktool
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool

      - name: Decompile APK to Smali + resources
        run: |
          apktool d Zara-1.0.apk -o decompiled -f

      - name: Show top-level structure
        run: |
          find decompiled -maxdepth 2 -type d | sort

      - name: Zip the decompiled output
        run: |
          cd decompiled && zip -r ../zara-decompiled.zip . && cd ..

      - name: Upload decompiled source as artifact
        uses: actions/upload-artifact@v4
        with:
          name: zara-decompiled
          path: zara-decompiled.zip
