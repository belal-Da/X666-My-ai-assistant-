name: Build Patched Zara APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download apktool (official GitHub release, bundles aapt2)
        run: |
          wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar -O apktool.jar
          ls -la apktool.jar

      - name: Decompile original APK
        run: |
          java -jar apktool.jar d Zara-1.0.apk -o decompiled -f

      - name: Apply patch(es)
        run: |
          cp patches/AgentThinker.smali decompiled/smali_classes4/com/myzara/zara/automation/AgentThinker.smali
          cp patches/live/GeminiLiveClient.smali decompiled/smali_classes11/com/myzara/zara/live/GeminiLiveClient.smali
          cp patches/res/values/strings.xml decompiled/res/values/strings.xml
          cp patches/res/drawable/ic_launcher_background.xml decompiled/res/drawable/ic_launcher_background.xml
          cp patches/res/drawable/ic_launcher_foreground.xml decompiled/res/drawable/ic_launcher_foreground.xml
          echo "Applied 5 patches: text-command prompt fix, live-voice prompt fix, app rename, new logo"

      - name: Rebuild APK (using aapt2 bundled in apktool)
        run: |
          java -jar apktool.jar b decompiled -o zara-unsigned.apk --use-aapt2

      - name: Generate a debug signing key
        run: |
          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Debug,O=Debug,C=US"

      - name: Find build-tools path
        id: bt
        run: |
          BT=$(find $ANDROID_HOME/build-tools -maxdepth 1 -type d | sort -V | tail -1)
          echo "path=$BT" >> $GITHUB_OUTPUT
          echo "Using build-tools at $BT"

      - name: Zipalign
        run: |
          ${{ steps.bt.outputs.path }}/zipalign -f -p 4 zara-unsigned.apk zara-aligned.apk

      - name: Sign the APK
        run: |
          ${{ steps.bt.outputs.path }}/apksigner sign --ks debug.keystore --ks-pass pass:android \
            --key-pass pass:android --out Zara-patched-signed.apk zara-aligned.apk

      - name: Upload signed patched APK
        uses: actions/upload-artifact@v4
        with:
          name: zara-patched-signed-apk
          path: Zara-patched-signed.apk
